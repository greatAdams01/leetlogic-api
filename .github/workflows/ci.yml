name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leetlogic_test
          POSTGRES_USER: leetlogic
          POSTGRES_PASSWORD: leetlogic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leetlogic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://leetlogic:leetlogic@localhost:5432/leetlogic_test?schema=public
      REDIS_URL: redis://localhost:6379
      ACCESS_TOKEN_SECRET: ci-access-token-secret-at-least-32-characters
      ADMIN_ACCESS_TOKEN_SECRET: ci-admin-token-secret-at-least-32-chars
      TOKEN_HASH_SECRET: ci-token-hash-secret-at-least-32-characters
      TOTP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      OTP_PROVIDER: console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @leetlogic/database exec prisma migrate deploy
      - run: pnpm verify

